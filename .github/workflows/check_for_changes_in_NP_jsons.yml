name: Check for changes in NP json files

on:
  schedule:
    - cron: '0 0 * * 2' # Every Tuesday at 00:00 UTC
  workflow_dispatch:

# Grant permissions for the job to write to contents (push) and create PRs.
permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-pr:
    runs-on: ubuntu-latest
    steps:

      - name: Check out local repository
        uses: actions/checkout@v4

      # Set up a Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' 

      # we use the released probeinterface, cloned so that the generation
      # scripts under resources/ are available as well
      - name: Install probeinterface and matplotlib
        run: |
          PROBEINTERFACE_VERSION=$(git ls-remote --tags --refs --sort=-v:refname https://github.com/spikeinterface/probeinterface | head -n 1 | sed 's|.*refs/tags/||')
          echo "Cloning probeinterface $PROBEINTERFACE_VERSION"
          git clone --depth 1 --branch "$PROBEINTERFACE_VERSION" https://github.com/spikeinterface/probeinterface ./probeinterface
          pip install ./probeinterface matplotlib


      - name: Generate full NP library and check for changes
        run: |
          cd scripts/
          # generate full library
          python ../probeinterface/resources/generate_neuropixels_library.py
          # check for json changes (except probeinterface version)
          python check_for_json_changes_in_probes.py ../imec/ ./neuropixels_library_generated/
          # clean up
          rm -r neuropixels_library_generated/
          cd ..
          rm -r ./probeinterface

      - name: Commit changes if any
        id: commit
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add imec/*

          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            git commit -m "Update json files for NP probes"
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Create pull request to add probes
        if: steps.commit.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          title: "Update Neuropixels json files"
          body: "This PR updates the Neuropixel probes in probeinterace library, based on new data from the ProbeTable repository or because of a new ProbeInterface release."
          branch-suffix: short-commit-hash
          base: "main"
